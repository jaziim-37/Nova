
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101018">
  <title>NOVA AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #101018;
      color: #f5f5fa;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      border-bottom: 1px solid #292938;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .orb {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #9d6bff, #4ddcff);
      box-shadow: 0 0 24px #805cff55;
    }

    header h2 {
      margin: 0;
      font-size: 20px;
    }

    header p {
      margin: 3px 0 0;
      color: #9b9bac;
      font-size: 12px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      padding: 13px 15px;
      border-radius: 16px;
      max-width: 88%;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .ai {
      align-self: flex-start;
      background: #20202e;
      border: 1px solid #303044;
    }

    .user {
      align-self: flex-end;
      background: #6345c7;
    }

    .composer {
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid #292938;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid #343448;
      border-radius: 14px;
      background: #1b1b27;
      color: white;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #9d6bff;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 0 17px;
      color: white;
      background: #805cff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <header>
    <div class="orb"></div>
    <div>
      <h2>NOVA</h2>
      <p>Your AI. Your rules. <span id="status">Offline demo</span></p>
    </div>
  </header>

  <main id="chat" aria-live="polite">
    <div class="message ai">Hey! I'm NOVA. 🧠

Currently running on pure enthusiasm and zero AI connections.

Send me a message to test the interface.</div>
  </main>

  <form class="composer" id="composer">
    <input
      id="message"
      placeholder="Message NOVA..."
      autocomplete="off"
      aria-label="Your message"
      required
    >
    <button type="submit">Send</button>
  </form>


<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("composer");
  const input = document.getElementById("message");

  const NOVA_BACKEND_URL =
    "https://nova.jasimsadiqs.workers.dev/";

  const CHAT_LIST_KEY = "nova_chat_list";
  const CURRENT_CHAT_KEY = "nova_current_chat";

  let chatId = "";
  let history = [];
  let chatList = [];
  let busy = false;

  function makeId() {
    return "chat_" +
      Date.now().toString(36) + "_" +
      Math.random().toString(36).slice(2, 12);
  }

  function addMessage(text, type) {
    const bubble = document.createElement("div");
    bubble.className = "message " + type;
    bubble.textContent = text;
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function saveLocalState() {
    localStorage.setItem(CHAT_LIST_KEY, JSON.stringify(chatList));
    localStorage.setItem(CURRENT_CHAT_KEY, chatId);
  }

  async function backend(payload) {
    const response = await fetch(NOVA_BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "NOVA request failed.");
    }

    return data;
  }

  function renderHistory() {
    chat.replaceChildren();

    if (!history.length) {
      addMessage("New conversation started. What's up?", "assistant");
      return;
    }

    for (const item of history) {
      addMessage(
        item.content,
        item.role === "user" ? "user" : "assistant"
      );
    }
  }

  async function openChat(id) {
    chatId = id;
    history = [];
    saveLocalState();
    chat.replaceChildren();
    addMessage("Loading conversation...", "assistant");

    try {
      const data = await backend({
        action: "load",
        chatId
      });

      history = Array.isArray(data.history) ? data.history : [];
      renderHistory();
    } catch (error) {
      chat.replaceChildren();
      addMessage("Could not load chat: " + error.message, "assistant");
    }
  }

  async function newChat() {
    if (busy) return;

    chatId = makeId();
    history = [];

    chatList.unshift({
      id: chatId,
      title: "New Chat",
      createdAt: Date.now()
    });

    saveLocalState();
    renderHistory();
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    if (busy) return;

    const message = input.value.trim();
    if (!message) return;

    if (!chatId) {
      await newChat();
    }

    busy = true;
    const sendButton = form.querySelector('button[type="submit"]');
    if (sendButton) sendButton.disabled = true;

    addMessage(message, "user");
    input.value = "";

    const loading = addMessage("NOVA is thinking...", "assistant");

    try {
      const data = await backend({
        action: "send",
        chatId,
        message
      });

      loading.textContent = data.reply || "Empty reply received.";

      history.push(
        { role: "user", content: message },
        { role: "assistant", content: data.reply }
      );

      // Keep the browser copy aligned with the backend's last 100 messages.
      history = history.slice(-100);

      const current = chatList.find(item => item.id === chatId);
      if (current && current.title === "New Chat") {
        current.title = message.slice(0, 40);
      }

      saveLocalState();

    } catch (error) {
      loading.textContent = "Error: " + error.message;
    } finally {
      busy = false;
      if (sendButton) sendButton.disabled = false;
      input.focus();
    }
  });

  const newChatButton = document.createElement("button");
  newChatButton.textContent = "＋ New Chat";
  newChatButton.type = "button";
  newChatButton.style.cssText =
    "position:fixed;top:12px;right:12px;z-index:9999;" +
    "padding:10px 14px;border-radius:10px;" +
    "border:1px solid #555;background:#202124;" +
    "color:white;font-size:14px;";

  newChatButton.addEventListener("click", newChat);
  document.body.appendChild(newChatButton);

  async function startNOVA() {
    try {
      chatList = JSON.parse(
        localStorage.getItem(CHAT_LIST_KEY) || "[]"
      );

      if (!Array.isArray(chatList)) chatList = [];
    } catch {
      chatList = [];
    }

    const previousId = localStorage.getItem(CURRENT_CHAT_KEY);

    if (
      previousId &&
      chatList.some(item => item.id === previousId)
    ) {
      await openChat(previousId);
    } else {
      await newChat();
    }
  }

  startNOVA();
</script>


</body>
</html>
