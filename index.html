
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101018">
  <title>NOVA AI</title>

  <style>
              * {
                    box-sizing: border-box;
                        }

                            body {
                                  margin: 0;
                                        font-family: system-ui, sans-serif;
                                              background: #101018;
                                                    color: #f5f5fa;
                                                          height: 100dvh;
                                                                display: flex;
                                                                      flex-direction: column;
                                                                          }

                                                                              header {
                                                                                    padding: 18px;
                                                                                          border-bottom: 1px solid #292938;
                                                                                                display: flex;
                                                                                                      align-items: center;
                                                                                                            gap: 12px;
                                                                                                                }

                                                                                                                    .orb {
                                                                                                                          width: 42px;
                                                                                                                                height: 42px;
                                                                                                                                      border-radius: 50%;
                                                                                                                                            background: linear-gradient(135deg, #9d6bff, #4ddcff);
                                                                                                                                                  box-shadow: 0 0 24px #805cff55;
                                                                                                                                                      }

                                                                                                                                                          header h2 {
                                                                                                                                                                margin: 0;
                                                                                                                                                                      font-size: 20px;
                                                                                                                                                                          }

                                                                                                                                                                              header p {
                                                                                                                                                                                    margin: 3px 0 0;
                                                                                                                                                                                          color: #9b9bac;
                                                                                                                                                                                                font-size: 12px;
                                                                                                                                                                                                    }

                                                                                                                                                                                                        #chat {
                                                                                                                                                                                                              flex: 1;
                                                                                                                                                                                                                    overflow-y: auto;
                                                                                                                                                                                                                          padding: 20px 14px;
                                                                                                                                                                                                                                display: flex;
                                                                                                                                                                                                                                      flex-direction: column;
                                                                                                                                                                                                                                            gap: 16px;
                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                    .message {
                                                                                                                                                                                                                                                          padding: 13px 15px;
                                                                                                                                                                                                                                                                border-radius: 16px;
                                                                                                                                                                                                                                                                      max-width: 88%;
                                                                                                                                                                                                                                                                            line-height: 1.55;
                                                                                                                                                                                                                                                                                  overflow-wrap: anywhere;
                                                                                                                                                                                                                                                                                        white-space: pre-wrap;
                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                .ai {
                                                                                                                                                                                                                                                                                                      align-self: flex-start;
                                                                                                                                                                                                                                                                                                            background: #20202e;
                                                                                                                                                                                                                                                                                                                  border: 1px solid #303044;
                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                          .user {
                                                                                                                                                                                                                                                                                                                                align-self: flex-end;
                                                                                                                                                                                                                                                                                                                                      background: #6345c7;
                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                              .composer {
                                                                                                                                                                                                                                                                                                                                                    padding: 12px;
                                                                                                                                                                                                                                                                                                                                                          padding-bottom: max(12px, env(safe-area-inset-bottom));
                                                                                                                                                                                                                                                                                                                                                                border-top: 1px solid #292938;
                                                                                                                                                                                                                                                                                                                                                                      display: flex;
                                                                                                                                                                                                                                                                                                                                                                            gap: 8px;
                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                    input {
                                                                                                                                                                                                                                                                                                                                                                                          flex: 1;
                                                                                                                                                                                                                                                                                                                                                                                                min-width: 0;
                                                                                                                                                                                                                                                                                                                                                                                                      padding: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                            border: 1px solid #343448;
                                                                                                                                                                                                                                                                                                                                                                                                                  border-radius: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                        background: #1b1b27;
                                                                                                                                                                                                                                                                                                                                                                                                                              color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                    outline: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                          font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                  input:focus {
                                                                                                                                                                                                                                                                                                                                                                                                                                                        border-color: #9d6bff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                button {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      border: 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            border-radius: 13px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  padding: 0 17px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              background: #805cff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          font-weight: 600;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        button:active {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              opacity: 0.8;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="orb"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2>NOVA</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <p>Your AI. Your rules. <span id="status">Offline demo</span></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <main id="chat" aria-live="polite">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="message ai">Hey! I'm NOVA. 🧠

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Currently running on pure enthusiasm and zero AI connections.

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Send me a message to test the interface.</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <form class="composer" id="composer">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    id="message"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          placeholder="Message NOVA..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                autocomplete="off"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      aria-label="Your message"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            required
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                >
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button type="submit">Send</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const chat = document.getElementById("chat");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const form = document.getElementById("composer");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const input = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function addMessage(text, type) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const bubble = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    bubble.className = "message " + type;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          bubble.textContent = text;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                chat.appendChild(bubble);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      chat.scrollTop = chat.scrollHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return bubble;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    form.addEventListener("submit", function (event) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          event.preventDefault();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const text = input.value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!text) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            addMessage(text, "user");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  input.value = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        addMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Message received! I'm still in demo mode. " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "My AI brain isn't connected yet. 🔌",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "ai"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
